# Render Blueprint: GitHub 저장소를 Render에 연결하면 이 설정으로 웹 서비스가 만들어집니다.
services:
  - type: web
    name: careermatch-portfolio
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: DART_API_KEY
        sync: false   # 값은 Render 화면에서 직접 입력 (저장소에 올리지 않음)
      - key: GEMINI_API_KEY
        sync: false
